<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminaCalc</title>
    <link rel="stylesheet" href="style/IndexStyle.css">
</head>
<body>

    <div id="main">
        <div class="bodyofcalculator">
            <div class="display">
                <input type="text" class="result" value="0" disabled>
            </div>
                <div class="buttons">
                    <button class="clearbtn">C</button>
                    <button class="deletebtn">Del</button>
                    <button class="operatobtn">+</button>
                    <button class="operatobtn">-</button>
                    <button class="operatobtn">x</button>
                    <button class="operatobtn">/</button>
                    <button class="equalsbtn">=</button>
                    <button class="decimalbtn">.</button>
                    <button class="gitbtn"> <img src="img/githubWhite.svg" alt="GitHub" onclick="window.open('https://github.com/Guilherme-N-Melo')"></button>
                    <button class="btn">1</button>
                    <button class="btn">2</button>
                    <button class="btn">3</button>
                    <button class="btn">4</button>
                    <button class="btn">5</button>
                    <button class="btn">6</button>
                    <button class="btn">7</button>
                    <button class="btn">8</button>
                    <button class="btn">9</button>
                    <button class="btn">0</button>
                    
                </div>
        </div>
    </div>
<script src="script/IndexScript.js"></script>
</body>
</html>
